<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>League HQ — Sleeper Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0f14; --panel:#131b24; --panel2:#19232f; --raised:#1f2c3a;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --text:#e9eef4; --muted:#8a97a6; --dim:#5e6b7a;
    --turf:#2bd576; --turf-dim:#1f9d57; --gold:#f5c542; --ice:#4aa8ff; --red:#ff5a6a; --violet:#9d7bff;
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;-webkit-font-smoothing:antialiased}
  body{
    background-image:
      radial-gradient(1200px 600px at 80% -10%, rgba(43,213,118,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(74,168,255,.08), transparent 55%),
      repeating-linear-gradient(90deg, transparent 0 78px, rgba(255,255,255,.012) 78px 80px);
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px 80px}
  h1,h2,h3,.os{font-family:'Oswald',sans-serif;letter-spacing:.5px}
  .num{font-family:'Oswald',sans-serif;font-variant-numeric:tabular-nums}

  /* Header */
  header.hero{padding:34px 0 18px;position:relative}
  .crumb{font-family:'Oswald';text-transform:uppercase;letter-spacing:3px;color:var(--turf);font-size:13px;font-weight:600}
  .hero h1{font-size:clamp(30px,5vw,52px);font-weight:700;text-transform:uppercase;line-height:1;margin:6px 0 4px}
  .hero .sub{color:var(--muted);font-size:14px}
  .hero .sub b{color:var(--text);font-weight:600}

  /* Tabs */
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:22px 0 26px;border-bottom:1px solid var(--line);padding-bottom:0}
  .tab{font-family:'Oswald';text-transform:uppercase;letter-spacing:1px;font-size:14px;font-weight:500;color:var(--muted);
       background:none;border:none;cursor:pointer;padding:11px 16px;border-bottom:2px solid transparent;transition:.18s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--turf);border-bottom-color:var(--turf)}

  /* Panels & cards */
  .panel{background:linear-gradient(180deg,var(--panel),#0f1620);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:16px}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
  .stat{padding:16px 18px}
  .stat .k{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-family:'Oswald'}
  .stat .v{font-size:30px;font-weight:700;font-family:'Oswald';margin-top:4px;line-height:1}
  .stat .v small{font-size:14px;color:var(--muted);font-weight:400}

  .section-title{font-family:'Oswald';text-transform:uppercase;letter-spacing:1.5px;font-size:18px;font-weight:600;
                 margin:30px 0 12px;display:flex;align-items:center;gap:10px}
  .section-title:before{content:"";width:5px;height:20px;background:var(--turf);border-radius:2px;display:inline-block}
  .section-note{color:var(--muted);font-size:13px;margin:-6px 0 14px;line-height:1.5}

  /* Champion banner */
  .champ-banner{display:flex;align-items:center;gap:18px;padding:22px 24px;border-radius:14px;
    background:linear-gradient(110deg, rgba(245,197,66,.16), rgba(245,197,66,.03) 55%, transparent),var(--panel);
    border:1px solid rgba(245,197,66,.35);box-shadow:var(--shadow)}
  .champ-banner .ring{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:30px;
    background:radial-gradient(circle at 30% 30%, #ffe79a, var(--gold));color:#3a2c00;flex:none;box-shadow:0 0 24px rgba(245,197,66,.4)}
  .champ-banner .ttl{font-family:'Oswald';text-transform:uppercase;letter-spacing:2px;color:var(--gold);font-size:13px;font-weight:600}
  .champ-banner .who{font-family:'Oswald';font-size:26px;font-weight:700;line-height:1.05}
  .champ-banner .meta{color:var(--muted);font-size:13px;margin-top:2px}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{font-family:'Oswald';text-transform:uppercase;letter-spacing:.8px;font-size:12px;color:var(--muted);
    text-align:right;padding:12px 12px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;user-select:none}
  thead th:first-child{text-align:left}
  thead th.sortable:hover{color:var(--text)}
  thead th .arr{opacity:.5;font-size:10px}
  tbody td{padding:12px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td:first-child{text-align:left}
  tbody tr:hover{background:rgba(255,255,255,.025)}
  .team-cell{display:flex;align-items:center;gap:10px}
  .av{width:30px;height:30px;border-radius:8px;object-fit:cover;background:var(--raised);flex:none}
  .team-cell .nm{font-weight:600}
  .team-cell .hd{font-size:11px;color:var(--dim)}
  .rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--raised);
    font-family:'Oswald';font-weight:600;font-size:13px;color:var(--muted);margin-right:4px}
  .rank.r1{background:var(--gold);color:#3a2c00}
  .rank.r2{background:#c8d0d8;color:#26303a}
  .rank.r3{background:#cd7f4d;color:#2a1500}
  .pos{color:var(--turf)} .neg{color:var(--red)}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-family:'Oswald';letter-spacing:.5px}
  .pill.gold{background:rgba(245,197,66,.16);color:var(--gold)}
  .pill.turf{background:rgba(43,213,118,.14);color:var(--turf)}
  .pill.ice{background:rgba(74,168,255,.14);color:var(--ice)}

  /* Controls */
  select,.btn{font-family:'Sora';background:var(--panel2);color:var(--text);border:1px solid var(--line2);
    border-radius:9px;padding:9px 12px;font-size:14px;cursor:pointer}
  select:focus{outline:1px solid var(--turf)}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .controls label{font-size:12px;color:var(--muted);font-family:'Oswald';text-transform:uppercase;letter-spacing:1px}
  .top-actions{position:absolute;right:0;top:34px;display:flex;gap:8px}
  .btn:hover{border-color:var(--turf);color:var(--text)}
  .btn:focus-visible,.tab:focus-visible,.mode-btn:focus-visible,.chip:focus-visible,.send-btn:focus-visible,select:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* Compare */
  .vs-head{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:22px;margin-bottom:16px}
  .vs-side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .vs-side .av{width:64px;height:64px;border-radius:14px}
  .vs-side .nm{font-family:'Oswald';font-size:20px;font-weight:600}
  .vs-x{font-family:'Oswald';font-size:34px;font-weight:700;color:var(--dim)}
  .cmp-row{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .cmp-row:last-child{border-bottom:none}
  .cmp-row .lbl{text-align:center;font-family:'Oswald';text-transform:uppercase;letter-spacing:1px;font-size:12px;color:var(--muted)}
  .cmp-row .l{text-align:right;font-family:'Oswald';font-size:20px;font-weight:600}
  .cmp-row .r{text-align:left;font-family:'Oswald';font-size:20px;font-weight:600}
  .cmp-row .win{color:var(--turf)}

  /* Bracket */
  .bracket{display:flex;gap:30px;overflow-x:auto;padding:6px 2px 16px}
  .round{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:210px}
  .round h4{font-family:'Oswald';text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--muted);margin-bottom:4px;text-align:center}
  .matchup{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .mteam{display:flex;align-items:center;gap:9px;padding:9px 11px;font-size:13px;border-bottom:1px solid var(--line)}
  .mteam:last-child{border-bottom:none}
  .mteam.w{background:rgba(43,213,118,.08)}
  .mteam.w .mname{font-weight:700;color:var(--text)}
  .mteam .mname{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mteam .mpts{font-family:'Oswald';font-weight:600;color:var(--muted)}
  .mteam.w .mpts{color:var(--turf)}
  .mteam .av{width:22px;height:22px;border-radius:6px}

  /* Draft board */
  .board-scroll{overflow-x:auto;padding-bottom:8px}
  .board{border-collapse:separate;border-spacing:5px}
  .board th{font-size:11px;padding:7px 6px;text-align:center;color:var(--muted)}
  .board th .av{width:22px;height:22px;margin:0 auto 4px;display:block}
  .board td{min-width:128px;padding:8px 9px;border-radius:8px;text-align:left;border-bottom:none}
  .board .rd{min-width:34px;text-align:center;font-family:'Oswald';color:var(--dim);font-weight:600;background:transparent;padding:0}
  .pick{font-size:12px;line-height:1.25}
  .pick .pn{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:118px}
  .pick .pm{font-size:10px;opacity:.75;font-family:'Oswald';letter-spacing:.5px}
  .QB{background:rgba(255,90,106,.16)} .RB{background:rgba(43,213,118,.16)}
  .WR{background:rgba(74,168,255,.16)} .TE{background:rgba(245,197,66,.16)}
  .K{background:rgba(157,123,255,.16)} .DEF{background:rgba(138,151,166,.16)} .FLEX{background:var(--panel2)}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .chart-box{padding:18px}
  .chart-box h3{font-family:'Oswald';text-transform:uppercase;letter-spacing:1px;font-size:15px;margin-bottom:12px;color:var(--text)}
  .chart-wrap{position:relative;height:300px}

  /* Loading / status */
  .loading{display:flex;align-items:center;gap:12px;color:var(--muted);padding:40px 20px;justify-content:center;font-size:14px}
  .spinner{width:20px;height:20px;border:2.5px solid var(--line2);border-top-color:var(--turf);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:rgba(255,90,106,.1);border:1px solid rgba(255,90,106,.3);color:#ffb3bb;padding:16px;border-radius:10px;font-size:14px;line-height:1.5}
  .empty{color:var(--muted);padding:30px;text-align:center;font-size:14px}
  .pad{padding:18px 20px}
  .fade{animation:fade .4s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:40px;line-height:1.6}
  a{color:var(--ice)}

  /* ---- League Bot ---- */
  .bot-modes{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .mode-btn{font-family:'Oswald';text-transform:uppercase;letter-spacing:1px;font-size:13px;font-weight:500;
    padding:9px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);cursor:pointer;transition:.15s}
  .mode-btn .em{margin-right:6px}
  .mode-btn:hover{color:var(--text)}
  .mode-btn.on.analyst{background:rgba(74,168,255,.16);border-color:var(--ice);color:var(--ice)}
  .mode-btn.on.smack{background:rgba(255,90,106,.16);border-color:var(--red);color:var(--red)}
  .chat{display:flex;flex-direction:column;height:540px;max-height:72vh}
  .chat-log{flex:1;overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg .bub{padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg.user .bub{background:var(--raised);border-bottom-right-radius:4px}
  .msg.bot .bub{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.bot.smack .bub{border-color:rgba(255,90,106,.3)}
  .msg .ava{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:16px;background:var(--raised)}
  .msg.bot .ava{background:linear-gradient(135deg,var(--turf-dim),var(--ice))}
  .msg.bot.smack .ava{background:linear-gradient(135deg,#a01e2b,var(--red))}
  .typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite both}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .chat-input{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
  .chat-input textarea{flex:1;resize:none;background:var(--panel2);color:var(--text);border:1px solid var(--line2);
    border-radius:12px;padding:11px 14px;font-family:'Sora';font-size:14px;line-height:1.4;max-height:120px}
  .chat-input textarea:focus{outline:1px solid var(--turf)}
  .send-btn{background:var(--turf);color:#062a14;border:none;border-radius:12px;padding:11px 18px;
    font-family:'Oswald';font-weight:600;text-transform:uppercase;letter-spacing:1px;font-size:14px;cursor:pointer;flex:none}
  .send-btn:disabled{opacity:.4;cursor:default}
  .suggests{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:12.5px;padding:7px 12px;border-radius:20px;background:var(--panel2);border:1px solid var(--line2);
    color:var(--muted);cursor:pointer;transition:.15s}
  .chip:hover{color:var(--text);border-color:var(--turf)}
  .bot-setup{background:rgba(74,168,255,.07);border:1px solid rgba(74,168,255,.25);border-radius:12px;padding:16px 18px;margin-bottom:16px;font-size:13.5px;line-height:1.6}
  .bot-setup b{color:var(--ice)}
  .keybox{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .keybox input{flex:1;min-width:220px;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:13px;font-family:monospace}

  /* table scroll container: lets wide tables swipe sideways with a pinned first column */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tscroll table{min-width:100%}

  @media(max-width:760px){
    .wrap{padding:0 12px 60px}
    header.hero{padding:24px 0 12px}
    .top-actions{top:20px}
    .two-col{grid-template-columns:1fr}

    /* tabs: horizontal swipe strip instead of wrapping */
    nav.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    nav.tabs::-webkit-scrollbar{display:none}
    .tab{flex:none;padding:11px 13px;font-size:13px}

    /* stat cards stack two-up and shrink */
    .stat-row{grid-template-columns:1fr 1fr;gap:10px}
    .stat{padding:13px 14px}
    .stat .v{font-size:24px}

    /* tables: smaller, tighter, swipe sideways with sticky team column */
    .pad{padding:12px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{font-size:13px}
    thead th,tbody td{padding:9px 8px}
    thead th:first-child,tbody td:first-child{
      position:sticky;left:0;z-index:2;
      background:linear-gradient(180deg,var(--panel),#0f1620);
      box-shadow:6px 0 8px -6px rgba(0,0,0,.6)}
    tbody tr:hover td:first-child{background:#141d27}
    .team-cell{gap:8px}
    .av{width:26px;height:26px}
    .team-cell .nm{font-size:13px}
    .rank{width:20px;height:20px;font-size:11px;margin-right:2px}

    /* champion banner stacks */
    .champ-banner{flex-direction:column;text-align:center;gap:12px;padding:18px}
    .champ-banner .who{font-size:22px}

    /* compare view stacks the two teams */
    .vs-head{grid-template-columns:1fr;gap:10px}
    .vs-x{display:none}
    .cmp-row{grid-template-columns:1fr 96px 1fr;gap:6px;padding:11px 6px}
    .cmp-row .l,.cmp-row .r{font-size:17px}
    .cmp-row .lbl{font-size:10px}

    /* draft board: shrink cells so more fit, smaller text */
    .board td{min-width:96px;padding:6px 7px}
    .pick{font-size:11px}
    .pick .pn{max-width:88px}
    .board th{font-size:10px}

    .section-title{font-size:16px;margin:22px 0 10px}
    .chart-wrap{height:240px}
    .controls{gap:8px}
    select,.btn{padding:8px 10px;font-size:13px}
  }
  @media(max-width:420px){
    .stat-row{grid-template-columns:1fr 1fr}
    .hero h1{font-size:26px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="crumb">League HQ · Sleeper</div>
    <h1 id="leagueName">Loading league…</h1>
    <div class="sub" id="leagueSub">Pulling data straight from Sleeper.</div>
    <div class="top-actions"><button class="btn" type="button" onclick="window.__refreshData()">Refresh data</button></div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="view"><div class="loading"><div class="spinner"></div>Loading your league…</div></main>

  <footer>
    Live data from the public Sleeper API · League ID <span id="lid"></span><br>
    Records and points use Sleeper's official roster totals. Past seasons load automatically from your league history.
  </footer>
</div>

<script>
"use strict";
const LEAGUE_ID = "1250337099442311168";
const BASE = "https://api.sleeper.app/v1";
const AV = id => id ? `https://sleepercdn.com/avatars/thumbs/${id}` : null;
document.getElementById('lid').textContent = LEAGUE_ID;

/* ========= LEAGUE BOT CONFIG (Google Gemini) =========
   Paste your Cloudflare Worker URL here after you deploy it (see the worker file).
   Until you do, the Bot tab runs in "local mode" where you can paste your own
   free Google AI Studio key (from aistudio.google.com) to test on your own machine. */
const BOT_ENDPOINT = "https://spring-flower-f04c.eugenechopov.workers.dev";  // your Cloudflare Worker
const BOT_MODEL = "gemini-2.5-flash";        // primary model (steadier free capacity)
const BOT_FALLBACK_MODEL = "gemini-2.5-flash-lite"; // used automatically if the primary is overloaded (503)
const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models";
/* ===================================================== */
let BYO_KEY = ""; // in-memory only, never saved

/* ---------- tiny fetch helper with cache ---------- */
const _cache = new Map();
const CACHE_PREFIX='league-hq:';
const CACHE_TTL=1000*60*10;
const cacheKey=url=>CACHE_PREFIX+btoa(url).replace(/=/g,'');
async function getJSON(url){
  if(_cache.has(url)) return _cache.get(url);
  const key=cacheKey(url);
  try{
    const saved=JSON.parse(localStorage.getItem(key));
    if(saved && Date.now()-saved.at<CACHE_TTL){ _cache.set(url,Promise.resolve(saved.data)); return saved.data; }
  }catch(e){}
  const p = fetch(url).then(r=>{ if(!r.ok) throw new Error(r.status+' '+url); return r.json(); }).then(data=>{
    try{ localStorage.setItem(key,JSON.stringify({at:Date.now(),data})); }catch(e){}
    return data;
  });
  _cache.set(url,p);
  try{ return await p; }catch(e){ _cache.delete(url); throw e; }
}
window.__refreshData=()=>{
  _cache.clear();
  try{ Object.keys(localStorage).filter(k=>k.startsWith(CACHE_PREFIX)).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  location.reload();
};

/* ---------- global data ---------- */
const D = {
  state:null, seasons:[], // [{league, users, rosters, winners, losers, drafts, userById, rosterById}]
  usersAll:{}, // user_id -> user (latest)
  matchupsLoaded:false, draftLoaded:false, txnLoaded:false, playersLoaded:false,
  players:null
};

function nameOf(uid){
  const u = D.usersAll[uid];
  if(!u) return 'Unknown';
  return (u.metadata && u.metadata.team_name) || u.display_name || u.username || 'Unknown';
}
function handleOf(uid){
  const u = D.usersAll[uid];
  return u ? ('@'+(u.display_name||u.username||'')) : '';
}
function avOf(uid){
  const u = D.usersAll[uid];
  if(!u) return null;
  const a = (u.metadata && u.metadata.avatar) ? u.metadata.avatar : (u.avatar? AV(u.avatar):null);
  return a;
}
function teamCell(uid){
  const a = avOf(uid);
  return `<div class="team-cell">${a?`<img class="av" src="${a}" onerror="this.style.visibility='hidden'">`:`<div class="av"></div>`}
    <div><div class="nm">${esc(nameOf(uid))}</div><div class="hd">${esc(handleOf(uid))}</div></div></div>`;
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = n => (n==null||isNaN(n))?'—':Number(n).toFixed(1);
const fpts = r => (r.settings.fpts||0) + (r.settings.fpts_decimal||0)/100;
const fptsA = r => (r.settings.fpts_against||0) + (r.settings.fpts_against_decimal||0)/100;

/* ---------- core load (fast) ---------- */
async function loadCore(){
  D.state = await getJSON(`${BASE}/state/nfl`).catch(()=>({week:1,season:''}));
  // walk season chain
  let id = LEAGUE_ID, guard=0;
  const chain=[];
  while(id && guard++<25){
    const lg = await getJSON(`${BASE}/league/${id}`);
    chain.push(lg);
    id = lg.previous_league_id;
  }
  // newest first already (chain order). load detail per season in parallel
  D.seasons = await Promise.all(chain.map(async lg=>{
    const [users,rosters,winners,losers] = await Promise.all([
      getJSON(`${BASE}/league/${lg.league_id}/users`).catch(()=>[]),
      getJSON(`${BASE}/league/${lg.league_id}/rosters`).catch(()=>[]),
      getJSON(`${BASE}/league/${lg.league_id}/winners_bracket`).catch(()=>[]),
      getJSON(`${BASE}/league/${lg.league_id}/losers_bracket`).catch(()=>[]),
    ]);
    const userById={}; users.forEach(u=>userById[u.user_id]=u);
    const rosterById={}; rosters.forEach(r=>rosterById[r.roster_id]=r);
    return {league:lg,users,rosters,winners,losers,userById,rosterById};
  }));
  // build usersAll (prefer newest season's record)
  for(let i=D.seasons.length-1;i>=0;i--){
    D.seasons[i].users.forEach(u=>{ D.usersAll[u.user_id]=u; });
  }
}

/* champion of a season from winners bracket */
function championOf(s){
  const final = (s.winners||[]).find(m=>m.p===1);
  if(!final || final.w==null) return null;
  const r = s.rosterById[final.w];
  return r ? r.owner_id : null;
}
function runnerUpOf(s){
  const final = (s.winners||[]).find(m=>m.p===1);
  if(!final || final.l==null) return null;
  const r = s.rosterById[final.l];
  return r ? r.owner_id : null;
}
function playoffRosterIds(s){
  const ids = new Set();
  (s.winners||[]).forEach(m=>{ [m.t1,m.t2].forEach(t=>{ if(typeof t==='number') ids.add(t); }); });
  return ids;
}
function seasonComplete(s){ return s.league.status==='complete' || championOf(s)!=null; }

/* ---------- lazy: matchups (all weeks, all seasons) ---------- */
async function ensureMatchups(){
  if(D.matchupsLoaded) return;
  await Promise.all(D.seasons.map(async s=>{
    const pStart = (s.league.settings && s.league.settings.playoff_week_start) || 15;
    const lastWeek = Math.min(pStart + 4, 18);
    const weeks = await Promise.all(
      Array.from({length:lastWeek},(_,i)=>i+1).map(w=>
        getJSON(`${BASE}/league/${s.league.league_id}/matchups/${w}`).then(d=>({w,d})).catch(()=>({w,d:[]})))
    );
    s.weeks = weeks.filter(x=>Array.isArray(x.d) && x.d.some(e=>e && e.points!=null && e.points>0));
    s.playoffStart = pStart;
    // season total points per player_id (for draft production)
    const pp={};
    s.weeks.forEach(({d})=>d.forEach(e=>{ const m=e.players_points||{}; for(const k in m){ pp[k]=(pp[k]||0)+(m[k]||0); }}));
    s.playerPoints = pp;
  }));
  D.matchupsLoaded=true;
}

/* head to head + all-play from matchups */
function buildH2H(seasons=D.seasons){
  const h2h={}; // ownerA|ownerB -> {wA,wB,ptsA,ptsB,games}
  const allplay={}; // owner -> {w,l,games}
  seasons.forEach(s=>{
    (s.weeks||[]).forEach(({w,d})=>{
      // all-play that week
      const scored = d.filter(e=>e.points!=null).map(e=>({owner:s.rosterById[e.roster_id]&&s.rosterById[e.roster_id].owner_id, pts:e.points}))
                      .filter(x=>x.owner);
      scored.forEach(a=>{
        allplay[a.owner]=allplay[a.owner]||{w:0,l:0,games:0};
        scored.forEach(b=>{ if(a.owner!==b.owner){ allplay[a.owner].games++; if(a.pts>b.pts)allplay[a.owner].w++; else if(a.pts<b.pts)allplay[a.owner].l++; }});
      });
      // head to head pairs
      const byMatch={};
      d.forEach(e=>{ if(e.matchup_id==null)return; (byMatch[e.matchup_id]=byMatch[e.matchup_id]||[]).push(e); });
      Object.values(byMatch).forEach(pair=>{
        if(pair.length!==2) return;
        const A=pair[0],B=pair[1];
        const oa=s.rosterById[A.roster_id]&&s.rosterById[A.roster_id].owner_id;
        const ob=s.rosterById[B.roster_id]&&s.rosterById[B.roster_id].owner_id;
        if(!oa||!ob) return;
        const key=[oa,ob].sort().join('|');
        const rec=h2h[key]=h2h[key]||{};
        rec[oa]=rec[oa]||{w:0,pts:0}; rec[ob]=rec[ob]||{w:0,pts:0};
        rec.games=(rec.games||0)+1;
        rec[oa].pts+=A.points; rec[ob].pts+=B.points;
        if(A.points>B.points)rec[oa].w++; else if(B.points>A.points)rec[ob].w++;
      });
    });
  });
  return {h2h,allplay};
}

async function renderThisWeek(){

  const cols=[['owner','Team'],['w','W'],['l','L'],['t','T'],['pct','Win%'],['pf','PF'],['pa','PA'],['diff','Diff'],['moves','Moves']];

      <td class="num">${r.moves}</td></tr>`;
  });
  document.getElementById('stBody').innerHTML=h+'</tbody></table></div>';
}

window.__profile=o=>{profileOwner=o;drawProfile();};
function drawProfile(){
  const o=profileOwner, rec={w:0,l:0,t:0,pf:0,seasons:0,titles:0,playoffs:0,finals:0};
  const scores=[];
  D.seasons.forEach(s=>{
    const r=s.rosters.find(x=>x.owner_id===o); if(!r)return;
    rec.w+=r.settings.wins||0;rec.l+=r.settings.losses||0;rec.t+=r.settings.ties||0;rec.pf+=fpts(r);rec.seasons++;
    if(championOf(s)===o)rec.titles++; if(runnerUpOf(s)===o)rec.finals++; if(playoffRosterIds(s).has(r.roster_id))rec.playoffs++;
    (s.weeks||[]).forEach(({w,d})=>{const e=d.find(x=>x.roster_id===r.roster_id);if(e&&e.points!=null)scores.push({points:e.points,season:s.league.season,week:w});});
  });
  const g=rec.w+rec.l+rec.t, pct=g?((rec.w+rec.t*.5)/g*100).toFixed(1):'—';
  const best=[...scores].sort((a,b)=>b.points-a.points)[0], worst=[...scores].sort((a,b)=>a.points-b.points)[0];
  const {h2h}=buildH2H(); let rival=null;
  Object.entries(h2h).forEach(([key,x])=>{if(!key.split('|').includes(o))return;const other=key.split('|').find(id=>id!==o), mine=(x[o]||{}).w||0, theirs=(x[other]||{}).w||0; if(!rival||x.games>rival.games)rival={other,games:x.games,mine,theirs};});

  h+='<div class="section-title">Career Snapshot</div><div class="panel pad"><table><tbody>';
  h+=`<tr><td>Seasons played</td><td class="num">${rec.seasons}</td></tr><tr><td>Career points</td><td class="num">${f1(rec.pf)}</td></tr><tr><td>Finals appearances</td><td class="num">${rec.finals}</td></tr>`;
  if(best)h+=`<tr><td>Best week</td><td class="num">${f1(best.points)} <span class="hd">(${best.season} W${best.week})</span></td></tr>`;
  if(worst)h+=`<tr><td>Lowest week</td><td class="num">${f1(worst.points)} <span class="hd">(${worst.season} W${worst.week})</span></td></tr>`;
  if(rival)h+=`<tr><td>Most-played rival</td><td class="num">${esc(nameOf(rival.other))} <span class="hd">(${rival.mine}-${rival.theirs} in ${rival.games})</span></td></tr>`;
  h+='</tbody></table></div>';document.getElementById('profileBody').innerHTML=h;
}

let cmpA=null,cmpB=null;

    <div id="cmpBody"></div></div>`;

window.__cmp=(s,v)=>{ if(s==='A')cmpA=v; else cmpB=v; drawCompare(); };
function drawCompare(){
  const {h2h,allplay}=buildH2H();
  const A=cmpA,B=cmpB;
  const key=[A,B].sort().join('|');
  const rec=h2h[key]||{};
  const ra=rec[A]||{w:0,pts:0}, rb=rec[B]||{w:0,pts:0};

  const tot=o=>{let w=0,l=0,t=0,pf=0,titles=0,po=0;
    D.seasons.forEach(s=>{ const r=s.rosters.find(x=>x.owner_id===o); if(r){w+=r.settings.wins||0;l+=r.settings.losses||0;t+=r.settings.ties||0;pf+=fpts(r);} 
      if(championOf(s)===o)titles++; if(playoffRosterIds(s).has(r?r.roster_id:-1))po++; });
    return {w,l,t,pf,titles,po};};
  const ta=tot(A),tb=tot(B);
  const apA=allplay[A]||{w:0,games:0}, apB=allplay[B]||{w:0,games:0};
  const a=el=>el?avOf(el):null;
  function row(lbl,va,vb,better){ // better: 'hi' or 'lo'
    let lw='',rw='';
    if(va!==vb){ const aWins= better==='lo'? va<vb : va>vb; if(aWins)lw='win'; else rw='win'; }
    return `<div class="cmp-row"><div class="l ${lw}">${va}</div><div class="lbl">${lbl}</div><div class="r ${rw}">${vb}</div></div>`;
  }
  let h=`<div class="panel vs-head">
    <div class="vs-side">${a(A)?`<img class="av" src="${a(A)}">`:'<div class="av"></div>'}<div class="nm">${esc(nameOf(A))}</div><div class="hd" style="color:var(--dim)">${esc(handleOf(A))}</div></div>
    <div class="vs-x">VS</div>
    <div class="vs-side">${a(B)?`<img class="av" src="${a(B)}">`:'<div class="av"></div>'}<div class="nm">${esc(nameOf(B))}</div><div class="hd" style="color:var(--dim)">${esc(handleOf(B))}</div></div>
  </div>`;
  h+=`<div class="section-title">Head-to-Head</div>
   <div class="section-note">Every time these two faced off, across regular season and playoffs.</div>
   <div class="panel">`;
  h+=row('Meetings',rec.games||0,rec.games||0,'hi');
  h+=row('H2H Wins',ra.w||0,rb.w||0,'hi');
  h+=row('Total Pts (H2H)',f1(ra.pts),f1(rb.pts),'hi');
  h+='</div>';
  h+=`<div class="section-title">Career Comparison</div><div class="panel">`;
  h+=row('Win %', winp(ta), winp(tb),'hi');
  h+=row('Total Wins',ta.w,tb.w,'hi');
  h+=row('Total Points',f1(ta.pf),f1(tb.pf),'hi');
  h+=row('Championships',ta.titles,tb.titles,'hi');
  h+=row('Playoff Trips',ta.po,tb.po,'hi');
  h+=row('All-Play Win%', f1(apA.games?apA.w/apA.games*100:0)+'%', f1(apB.games?apB.w/apB.games*100:0)+'%','hi');
  h+='</div>';
  document.getElementById('cmpBody').innerHTML=h;
  function winp(t){const g=t.w+t.l+t.t;return (g?((t.w+t.t*.5)/g*100):0).toFixed(1)+'%';}
}

/* All-time playoff résumé per manager, built from every season's winners bracket. */
function allTimePlayoffTable(){
  const rec={}; // owner -> {titles,finals,third,trips,pw,pl,best}
  D.seasons.forEach(s=>{
    const wb=s.winners||[]; if(!wb.length) return;
    const champ=championOf(s), ru=runnerUpOf(s);
    const po=playoffRosterIds(s);
    po.forEach(rid=>{ const o=s.rosterById[rid]&&s.rosterById[rid].owner_id; if(!o)return;
      (rec[o]=rec[o]||{titles:0,finals:0,trips:0,pw:0,pl:0,best:99}).trips++; });
    if(champ){ const a=rec[champ]=rec[champ]||{titles:0,finals:0,trips:0,pw:0,pl:0,best:99}; a.titles++; a.finals++; a.best=Math.min(a.best,1); }
    if(ru){ const a=rec[ru]=rec[ru]||{titles:0,finals:0,trips:0,pw:0,pl:0,best:99}; a.finals++; a.best=Math.min(a.best,2); }
    // playoff W-L and best finish from bracket placements
    wb.forEach(m=>{
      const wo=m.w!=null&&s.rosterById[m.w]?s.rosterById[m.w].owner_id:null;
      const lo=m.l!=null&&s.rosterById[m.l]?s.rosterById[m.l].owner_id:null;
      if(wo){(rec[wo]=rec[wo]||{titles:0,finals:0,trips:0,pw:0,pl:0,best:99}).pw++;}
      if(lo){(rec[lo]=rec[lo]||{titles:0,finals:0,trips:0,pw:0,pl:0,best:99}).pl++;}
      if(m.p){ // placement match sets a finish
        if(wo){const a=rec[wo];a.best=Math.min(a.best,m.p);}
        if(lo){const a=rec[lo];a.best=Math.min(a.best,m.p+1);}
      }
    });
  });
  const arr=Object.entries(rec).map(([o,a])=>({owner:o,...a,best:a.best===99?null:a.best}))
    .sort((x,y)=>(y.titles-x.titles)||(y.finals-x.finals)||(y.trips-x.trips)||(y.pw-x.pw));
  if(!arr.length) return '';
  let h='<div class="section-title">All-Time Playoff Résumé</div>'
    +'<div class="section-note">Titles, finals trips, playoff appearances, playoff win-loss record, and best-ever finish — across every season.</div>';
  h+='<div class="panel pad"><table><thead><tr><th>Manager</th><th>🏆</th><th>Finals</th><th>Trips</th><th>PO W-L</th><th>Best Finish</th></tr></thead><tbody>';
  const ord=n=>n==1?'1st':n==2?'2nd':n==3?'3rd':n+'th';
  arr.forEach((r,i)=>{
    h+=`<tr><td><span class="rank ${i<3?'r'+(i+1):''}">${i+1}</span>${teamCell(r.owner)}</td>
      <td class="num">${r.titles?'<span class="pill gold">'+r.titles+'</span>':'—'}</td>
      <td class="num">${r.finals||'—'}</td><td class="num">${r.trips}</td>
      <td class="num">${r.pw}-${r.pl}</td>
      <td class="num">${r.best?ord(r.best):'—'}</td></tr>`;
  });
  return h+'</tbody></table></div>';
}
function drawPlayoffs(){
  let body=document.getElementById('poBody');
  if(poSeasonIdx===-1){ body.innerHTML=allTimePlayoffTable() || '<div class="empty">No playoff history yet.</div>'; return; }
  const s=D.seasons[poSeasonIdx];
  const wb=s.winners||[];
  if(!wb.length){ body.innerHTML='<div class="empty">No playoff bracket yet for this season.</div>'; return; }
  // group by round
  const rounds={}; let maxR=0;
  wb.forEach(m=>{ (rounds[m.r]=rounds[m.r]||[]).push(m); maxR=Math.max(maxR,m.r); });
  const champ=championOf(s);
  let h='';
  if(champ){ h+=`<div class="champ-banner" style="margin-bottom:18px"><div class="ring">🏆</div>
    <div><div class="ttl">${esc(s.league.season)} Champion</div><div class="who">${esc(nameOf(champ))}</div>
    <div class="meta">Defeated ${esc(runnerUpOf(s)?nameOf(runnerUpOf(s)):'—')} in the final</div></div></div>`; }
  h+='<div class="panel pad"><div class="bracket">';
  for(let r=1;r<=maxR;r++){
    const label = r===maxR?'Final': r===maxR-1?'Semifinals':'Round '+r;
    h+=`<div class="round"><h4>${label}</h4>`;
    (rounds[r]||[]).sort((a,b)=>(a.m||0)-(b.m||0)).forEach(m=>{
      h+=matchupCard(s,m);
    });
    h+='</div>';
  }
  h+='</div></div>';
  // placement summary
  const places=wb.filter(m=>m.p!=null).sort((a,b)=>a.p-b.p);
  if(places.length){
    h+='<div class="section-title">Final Placements</div><div class="panel pad"><table><thead><tr><th>Place</th><th style="text-align:left">Winner</th><th style="text-align:left">Loser</th></tr></thead><tbody>';
    places.forEach(m=>{
      const wo=m.w!=null&&s.rosterById[m.w]?s.rosterById[m.w].owner_id:null;
      const lo=m.l!=null&&s.rosterById[m.l]?s.rosterById[m.l].owner_id:null;
      const lbl=m.p===1?'🥇 1st / 2nd':m.p===3?'🥉 3rd / 4th':'#'+m.p;
      h+=`<tr><td style="text-align:left"><span class="pill ${m.p===1?'gold':'turf'}">${lbl}</span></td>
        <td style="text-align:left">${wo?teamCell(wo):'—'}</td><td style="text-align:left">${lo?teamCell(lo):'—'}</td></tr>`;
    });
    h+='</tbody></table></div>';
  }
  body.innerHTML=h;
}
function matchupCard(s,m){
  function side(t){
    if(typeof t!=='number'){ return `<div class="mteam"><div class="av"></div><span class="mname" style="color:var(--dim)">${t&&t.w?'Winner R'+t.w.r:t&&t.l?'Loser R'+t.l.r:'TBD'}</span></div>`; }
    const o=s.rosterById[t]?s.rosterById[t].owner_id:null;
    const isW=m.w===t;
    const av=o?avOf(o):null;
    return `<div class="mteam ${isW?'w':''}">${av?`<img class="av" src="${av}">`:'<div class="av"></div>'}<span class="mname">${esc(o?nameOf(o):'Team '+t)}</span>${isW?'<span class="mpts">W</span>':''}</div>`;
  }
  return `<div class="matchup">${side(m.t1)}${side(m.t2)}</div>`;
}

/* All-time draft value: every pick across every season, credited to the drafter. */
function allTimeDraftTable(){
  const prod={}; // owner -> {pts,picks,retained,drafts,delta}
  D.seasons.forEach(s=>{
    const picks=s.draftPicks||[]; if(!picks.length) return;
    const finalRosterPlayers={}; s.rosters.forEach(r=>finalRosterPlayers[r.owner_id]=new Set(r.players||[]));
    const roundAvg={}; picks.forEach(p=>{const pts=(s.playerPoints&&s.playerPoints[p.player_id])||0;(roundAvg[p.round]=roundAvg[p.round]||[]).push(pts);});
    Object.keys(roundAvg).forEach(r=>roundAvg[r]=roundAvg[r].reduce((a,b)=>a+b,0)/roundAvg[r].length);
    picks.forEach(p=>{
      const o=p.picked_by||(s.rosterById[p.roster_id]&&s.rosterById[p.roster_id].owner_id);
      if(!o)return;
      const a=prod[o]=prod[o]||{pts:0,picks:0,retained:0,drafts:new Set(),delta:0};
      a.picks++; a.drafts.add(s.league.season);
      const pts=(s.playerPoints&&s.playerPoints[p.player_id])||0; a.pts+=pts; a.delta+=pts-(roundAvg[p.round]||0);
      if(finalRosterPlayers[o]&&finalRosterPlayers[o].has(p.player_id))a.retained++;
    });
  });
  const arr=Object.entries(prod).map(([o,a])=>({owner:o,pts:a.pts,picks:a.picks,retained:a.retained,delta:a.delta,
    drafts:a.drafts.size, ppp:a.picks?a.pts/a.picks:0, ret:a.picks?a.retained/a.picks:0}))
    .sort((x,y)=>y.ppp-x.ppp);
  if(!arr.length) return '';
  let h='<div class="section-title">All-Time Draft Value</div>'
    +'<div class="section-note">Production is scored against the average player drafted in the same round, so early picks are held to a higher bar.</div>';
  h+='<div class="panel pad"><table><thead><tr><th>Manager</th><th>Drafts</th><th>Picks</th><th>Total Pts</th><th>Vs Round</th><th>Pts/Pick</th><th>Kept%</th></tr></thead><tbody>';
  arr.forEach((r,i)=>{
    h+=`<tr><td><span class="rank ${i<3?'r'+(i+1):''}">${i+1}</span>${teamCell(r.owner)}</td>
      <td class="num">${r.drafts}</td><td class="num">${r.picks}</td><td class="num">${f1(r.pts)}</td><td class="num ${r.delta>=0?'pos':'neg'}">${r.delta>=0?'+':''}${f1(r.delta)}</td>
      <td class="num">${f1(r.ppp)}</td><td class="num">${(r.ret*100).toFixed(0)}%</td></tr>`;
  });
  return h+'</tbody></table></div>';
}
function drawDraft(){
  const body=document.getElementById('drBody');
  if(drSeasonIdx===-1){ body.innerHTML=allTimeDraftTable() || '<div class="empty">No draft history yet.</div>'; return; }
  const s=D.seasons[drSeasonIdx];
  const picks=s.draftPicks||[];
  if(!picks.length){ body.innerHTML='<div class="empty">No draft data for this season.</div>'; return; }

  // who drafted: picked_by user_id; map slot -> owner via round-1 picks
  const slotRoster={}; picks.forEach(p=>{ if(p.round===1)slotRoster[p.draft_slot]=p.roster_id; });
  const slots=Object.keys(slotRoster).map(Number).sort((a,b)=>a-b);
  const rounds=Math.max(...picks.map(p=>p.round));

  // draft production: total season pts of each drafted player, credited to drafter
  const prod={}; // owner -> {pts, picks, retained}
  const finalRosterPlayers={}; s.rosters.forEach(r=>finalRosterPlayers[r.owner_id]=new Set(r.players||[]));
  const roundAvg={}; picks.forEach(p=>{const pts=(s.playerPoints&&s.playerPoints[p.player_id])||0;(roundAvg[p.round]=roundAvg[p.round]||[]).push(pts);});
  Object.keys(roundAvg).forEach(r=>roundAvg[r]=roundAvg[r].reduce((a,b)=>a+b,0)/roundAvg[r].length);
  picks.forEach(p=>{
    const o = p.picked_by || (s.rosterById[p.roster_id]&&s.rosterById[p.roster_id].owner_id);
    if(!o)return;
    const a=prod[o]=prod[o]||{pts:0,picks:0,retained:0,delta:0};
    a.picks++;
    const pts=(s.playerPoints&&s.playerPoints[p.player_id])||0; a.pts+=pts; a.delta+=pts-(roundAvg[p.round]||0);
    if(finalRosterPlayers[o]&&finalRosterPlayers[o].has(p.player_id))a.retained++;
  });
  const prodArr=Object.entries(prod).map(([o,a])=>({owner:o,...a,ppp:a.picks?a.pts/a.picks:0,ret:a.picks?a.retained/a.picks:0}))
    .sort((x,y)=>y.pts-x.pts);

  // grade table
  let h='<div class="section-title">Draft Value</div>'
    +'<div class="section-note">Draft points are also compared with the average player taken in the same round, making early and late picks comparable.</div>';
  h+='<div class="panel pad"><table><thead><tr><th>Manager</th><th>Picks</th><th>Total Pts</th><th>Vs Round</th><th>Pts/Pick</th><th>Kept</th></tr></thead><tbody>';
  prodArr.forEach((r,i)=>{
    h+=`<tr><td><span class="rank ${i<3?'r'+(i+1):''}">${i+1}</span>${teamCell(r.owner)}</td>
      <td class="num">${r.picks}</td><td class="num">${f1(r.pts)}</td><td class="num ${r.delta>=0?'pos':'neg'}">${r.delta>=0?'+':''}${f1(r.delta)}</td><td class="num">${f1(r.ppp)}</td>
      <td class="num">${r.retained}/${r.picks} <span style="color:var(--muted)">(${(r.ret*100).toFixed(0)}%)</span></td></tr>`;
  });
  h+='</tbody></table></div>';

  // board
  const byCell={}; picks.forEach(p=>{ byCell[p.round+'-'+p.draft_slot]=p; });
  h+='<div class="section-title">Draft Board</div><div class="panel pad board-scroll"><table class="board"><thead><tr><th class="rd"></th>';
  slots.forEach(sl=>{ const o=s.rosterById[slotRoster[sl]]?s.rosterById[slotRoster[sl]].owner_id:null; const av=o?avOf(o):null;
    h+=`<th>${av?`<img class="av" src="${av}">`:''}${esc(o?nameOf(o).slice(0,12):'Slot '+sl)}</th>`; });
  h+='</tr></thead><tbody>';
  for(let r=1;r<=rounds;r++){
    h+=`<tr><td class="rd">${r}</td>`;
    slots.forEach(sl=>{
      const p=byCell[r+'-'+sl];
      if(!p){ h+='<td></td>'; return; }
      const md=p.metadata||{};
      const pos=(md.position||'FLEX').toUpperCase();
      const nm=[md.first_name,md.last_name].filter(Boolean).join(' ')||playerName(p.player_id);
      h+=`<td class="${pos}"><div class="pick"><span class="pn">${esc(nm)}</span><span class="pm">${esc(pos)}${md.team?' · '+esc(md.team):''}</span></div></td>`;
    });
    h+='</tr>';
  }
  h+='</tbody></table></div>';
  body.innerHTML=h;
}

let wvSeasonIdx=-1; // -1 = All-Time
async function renderWaiver(){
  view.innerHTML='<div class="loading"><div class="spinner"></div>Loading transactions and the player list (this one is a big file)…</div>';
  await Promise.all([ensureTxns(), ensurePlayers()]);

function drawWaiver(){
  // Which seasons to include: all, or just the picked one.
  const seasons = wvSeasonIdx===-1 ? D.seasons : [D.seasons[wvSeasonIdx]];
  const scopeLabel = wvSeasonIdx===-1 ? ('all '+D.seasons.length+' seasons') : (seasons[0].league.season+' season');

  const mgr={}, addCount={}, bigBids=[], trades=[];
  const usesFaab = seasons.some(s=>s.league.settings && s.league.settings.waiver_type===2);
  seasons.forEach(s=>{
    (s.txns||[]).forEach(t=>{
      if(t.status!=='complete') return;
      if(t.type==='trade'){
        trades.push({season:s.league.season,rosters:(t.roster_ids||[]).map(rid=>s.rosterById[rid]&&s.rosterById[rid].owner_id), t});
      }
      const adds=t.adds||{}, drops=t.drops||{};
      for(const pid in adds){
        const rid=adds[pid]; const o=s.rosterById[rid]&&s.rosterById[rid].owner_id;
        if(!o)continue;
        const m=mgr[o]=mgr[o]||{adds:0,drops:0,trades:0,faab:0};
        m.adds++; addCount[pid]=(addCount[pid]||0)+1;
        const bid=t.settings&&t.settings.waiver_bid;
        if(bid){ m.faab+=bid; bigBids.push({owner:o,player:pid,bid,season:s.league.season}); }
      }
      for(const pid in drops){ const rid=drops[pid]; const o=s.rosterById[rid]&&s.rosterById[rid].owner_id; if(o){(mgr[o]=mgr[o]||{adds:0,drops:0,trades:0,faab:0}).drops++;} }
      if(t.type==='trade'){ (t.roster_ids||[]).forEach(rid=>{const o=s.rosterById[rid]&&s.rosterById[rid].owner_id; if(o)(mgr[o]=mgr[o]||{adds:0,drops:0,trades:0,faab:0}).trades++;}); }
    });
  });
  const mgrArr=Object.entries(mgr).map(([o,m])=>({owner:o,...m})).sort((a,b)=>b.adds-a.adds);
  const topAdds=Object.entries(addCount).sort((a,b)=>b[1]-a[1]).slice(0,12);
  bigBids.sort((a,b)=>b.bid-a.bid);

  const body=document.getElementById('wvBody');

async function renderTrends(){
  await ensureMatchups();
  const cur=D.seasons[0];
  // Luck must use this season only; career all-play records distort current results.
  const {allplay}=buildH2H([cur]);
  // luck: actual wins vs all-play expected wins (current season)
  const st=standingsArr(cur);
  const luck=st.map(r=>{
    const ap=allplay[r.owner]||{w:0,games:0};
    const exp= ap.games? (ap.w/ap.games)*(r.w+r.l+r.t) : 0;
    return {owner:r.owner,actual:r.w,exp,luck:r.w-exp,pf:r.pf};
  }).sort((a,b)=>b.luck-a.luck);

  let html='<div class="fade"><div class="section-title">Weekly Scoring — '+esc(cur.league.season)+'</div>'
    +'<div class="section-note">Points each team scored per week. Click a team in the legend to hide or show its line.</div>'
    +'<div class="panel chart-box"><div class="chart-wrap"><canvas id="cWeekly"></canvas></div></div>';
  html+='<div class="two-col">'
    +'<div class="chart-box panel"><h3>Points For (Season)</h3><div class="chart-wrap"><canvas id="cPF"></canvas></div></div>'
    +'<div class="chart-box panel"><h3>Luck Index</h3><div class="chart-wrap"><canvas id="cLuck"></canvas></div></div>'
    +'</div>';
  html+='<div class="section-title">Luck Report</div>'
    +'<div class="section-note">"Expected wins" come from how a team scored against the whole league each week (all-play). A team above its expected wins has been lucky; below it, unlucky.</div>';
  html+='<div class="panel pad"><table><thead><tr><th>Team</th><th>Wins</th><th>Expected</th><th>Luck</th></tr></thead><tbody>';
  luck.forEach(r=>{ html+=`<tr><td>${teamCell(r.owner)}</td><td class="num">${r.actual}</td><td class="num">${f1(r.exp)}</td>
    <td class="num ${r.luck>=0?'pos':'neg'}">${r.luck>=0?'+':''}${f1(r.luck)}</td></tr>`; });
  html+='</tbody></table></div>';

  // ---- All-time section ----
  html+='<div class="section-title">All-Time Points Per Game</div>'
    +'<div class="section-note">Average points scored per game across every season — the cleanest measure of who scores, regardless of luck or schedule.</div>'
    +'<div class="panel chart-box"><div class="chart-wrap"><canvas id="cAllPPG"></canvas></div></div>';
  html+='<div class="section-title">Scoring by Season</div>'
    +'<div class="section-note">Each team\'s average points per game, season by season. Use the legend to focus on a team.</div>'
    +'<div class="panel chart-box"><div class="chart-wrap" style="height:340px"><canvas id="cSeasonPPG"></canvas></div></div>';
  html+='</div>';
  view.innerHTML=html;

  // build weekly series
  const palette=['#2bd576','#4aa8ff','#f5c542','#ff5a6a','#9d7bff','#3dd1c4','#ff9d4a','#e879f9','#a3e635','#60a5fa','#fb7185','#facc15'];
  const owners=cur.rosters.map(r=>r.owner_id);
  const weeksReg=(cur.weeks||[]).filter(x=>x.w < (cur.playoffStart||15)).sort((a,b)=>a.w-b.w);
  const labels=weeksReg.map(x=>'W'+x.w);
  const series=owners.map((o,i)=>{
    const data=weeksReg.map(({d})=>{ const e=d.find(x=>s_owner(cur,x.roster_id)===o); return e&&e.points!=null?+e.points.toFixed(1):null; });
    return {label:nameOf(o),data,borderColor:palette[i%palette.length],backgroundColor:palette[i%palette.length],tension:.3,borderWidth:2,pointRadius:0,pointHoverRadius:4};
  });
  function s_owner(s,rid){return s.rosterById[rid]?s.rosterById[rid].owner_id:null;}
  const gridc='rgba(255,255,255,.06)', tickc='#8a97a6';
  charts.push(new Chart(document.getElementById('cWeekly'),{type:'line',data:{labels,datasets:series},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest'},
      plugins:{legend:{labels:{color:tickc,font:{family:'Sora',size:11},boxWidth:10}}},
      scales:{x:{grid:{color:gridc},ticks:{color:tickc}},y:{grid:{color:gridc},ticks:{color:tickc}}}}}));

  const pfSorted=[...st].sort((a,b)=>b.pf-a.pf);
  charts.push(new Chart(document.getElementById('cPF'),{type:'bar',
    data:{labels:pfSorted.map(r=>nameOf(r.owner)),datasets:[{data:pfSorted.map(r=>+r.pf.toFixed(1)),backgroundColor:'#2bd576',borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{color:tickc,maxRotation:60,minRotation:45,font:{size:10}}},y:{grid:{color:gridc},ticks:{color:tickc}}}}}));

  charts.push(new Chart(document.getElementById('cLuck'),{type:'bar',
    data:{labels:luck.map(r=>nameOf(r.owner)),datasets:[{data:luck.map(r=>+r.luck.toFixed(2)),
      backgroundColor:luck.map(r=>r.luck>=0?'#4aa8ff':'#ff5a6a'),borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{color:tickc,maxRotation:60,minRotation:45,font:{size:10}}},y:{grid:{color:gridc},ticks:{color:tickc}}}}}));

  // ---- All-time charts ----
  // Per-season PPG per owner, and all-time PPG.
  const seasonsAsc=[...D.seasons].sort((a,b)=>(+a.league.season)-(+b.league.season));
  const seasonLabels=seasonsAsc.map(s=>s.league.season);
  const allPPG={}; // owner -> {pf, games}
  const perSeason={}; // owner -> {season -> ppg}
  seasonsAsc.forEach(s=>{
    s.rosters.forEach(r=>{
      const o=r.owner_id; if(!o)return;
      const g=(r.settings.wins||0)+(r.settings.losses||0)+(r.settings.ties||0);
      const pf=fpts(r);
      if(g>0){
        (allPPG[o]=allPPG[o]||{pf:0,games:0}); allPPG[o].pf+=pf; allPPG[o].games+=g;
        (perSeason[o]=perSeason[o]||{})[s.league.season]=pf/g;
      }
    });
  });
  const ppgArr=Object.entries(allPPG).map(([o,a])=>({owner:o,ppg:a.games?a.pf/a.games:0}))
    .sort((x,y)=>y.ppg-x.ppg);
  charts.push(new Chart(document.getElementById('cAllPPG'),{type:'bar',
    data:{labels:ppgArr.map(r=>nameOf(r.owner)),datasets:[{data:ppgArr.map(r=>+r.ppg.toFixed(1)),backgroundColor:'#f5c542',borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{color:tickc,maxRotation:60,minRotation:45,font:{size:10}}},y:{grid:{color:gridc},ticks:{color:tickc}}}}}));

  const ownersAll=ppgArr.map(r=>r.owner);
  const seasonSeries=ownersAll.map((o,i)=>({
    label:nameOf(o),
    data:seasonLabels.map(sl=> perSeason[o]&&perSeason[o][sl]!=null ? +perSeason[o][sl].toFixed(1) : null),
    borderColor:palette[i%palette.length], backgroundColor:palette[i%palette.length],
    tension:.3, borderWidth:2, pointRadius:2, pointHoverRadius:4, spanGaps:true
  }));
  charts.push(new Chart(document.getElementById('cSeasonPPG'),{type:'line',
    data:{labels:seasonLabels,datasets:seasonSeries},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest'},
      plugins:{legend:{labels:{color:tickc,font:{family:'Sora',size:11},boxWidth:10}}},
      scales:{x:{grid:{color:gridc},ticks:{color:tickc}},y:{grid:{color:gridc},ticks:{color:tickc}}}}}));
}

let botMode='analyst'; // 'analyst' | 'smack'
let botHistory=[];     // [{role, content}]
let botBusy=false;

/* Build a compact, factual snapshot of the league for the model. */
async function buildLeagueContext(){
  await ensureMatchups();
  const cur=D.seasons[0];
  const lines=[];
  lines.push(`League: ${cur.league.name||'Fantasy League'} (${cur.league.season} season, ${cur.league.total_rosters||cur.rosters.length} teams).`);
  lines.push(`Current NFL week: ${D.state.week||'?'}. Seasons tracked: ${D.seasons.length}.`);

  // current standings
  const st=standingsArr(cur);
  lines.push('\nCURRENT STANDINGS (rank. team — W-L, PF, PA):');
  st.forEach((r,i)=>lines.push(`${i+1}. ${nameOf(r.owner)} — ${r.w}-${r.l}${r.t?'-'+r.t:''}, PF ${f1(r.pf)}, PA ${f1(r.pa)}`));

  // champions
  const champs=D.seasons.filter(seasonComplete).map(s=>`${s.league.season}: ${nameOf(championOf(s))}`);
  if(champs.length) lines.push('\nPAST CHAMPIONS — '+champs.join(' | '));

  // all-time records
  const agg={},titles={};
  D.seasons.forEach(s=>{ const c=championOf(s); if(c)titles[c]=(titles[c]||0)+1;
    s.rosters.forEach(r=>{const o=r.owner_id;if(!o)return;const a=agg[o]=agg[o]||{w:0,l:0,pf:0};
      a.w+=r.settings.wins||0;a.l+=r.settings.losses||0;a.pf+=fpts(r);}); });
  const allt=Object.entries(agg).map(([o,a])=>({o,...a,titles:titles[o]||0}))
    .sort((x,y)=>(y.titles-x.titles)||(y.w-x.w));
  lines.push('\nALL-TIME (team — total W-L, total PF, titles):');
  allt.forEach(r=>lines.push(`${nameOf(r.o)} — ${r.w}-${r.l}, ${f1(r.pf)} pts, ${r.titles} title(s)`));

  // luck this season
  const {allplay}=buildH2H();
  const luck=st.map(r=>{const ap=allplay[r.owner]||{w:0,games:0};
    const exp=ap.games?(ap.w/ap.games)*(r.w+r.l+r.t):0;return {o:r.owner,d:r.w-exp};})
    .sort((a,b)=>b.d-a.d);
  if(luck.length){
    lines.push(`\nLUCK: Luckiest is ${nameOf(luck[0].o)} (+${f1(luck[0].d)} wins over expected). Unluckiest is ${nameOf(luck[luck.length-1].o)} (${f1(luck[luck.length-1].d)}).`);
  }
  return lines.join('\n');
}

function systemPromptFor(mode, ctx){
  const base=`You are the resident AI for a Sleeper fantasy football league. You have the league's real data below. Always ground what you say in THIS data — use real team names, real records, real numbers. Never invent stats. If asked something the data can't answer, say so briefly. Keep replies tight: a few sentences, not essays.\n\n=== LEAGUE DATA ===\n${ctx}\n=== END DATA ===`;
  if(mode==='smack'){
    return base+`\n\nMODE: TRASH TALK. You are the league's merciless, sharp-tongued commissioner. Roast these managers with creativity and specifics — name names, twist the knife with their real records, blown leads, pathetic point totals, title droughts, and draft busts. Vary your insults; don't reuse the same joke. Be genuinely funny, not just mean.\n\nLANGUAGE: This is a group of adults who can take it. Profanity is allowed and encouraged when it lands the joke, ESPECIALLY if the user asks you to swear or get crude. Be vulgar, be savage, go R-rated. Crude is fine; clever-crude is better.\n\nHARD LIMITS (never cross these, even if asked): no slurs of any kind; no attacks on race, religion, gender, sexuality, disability, or other protected traits; no sexual content about real people; nothing about anyone's real-life family, health, or genuine misfortune. Keep it about FANTASY FOOTBALL — their crappy team, their bad calls, their losing. Roast the manager's football moves, not the human being. 2-4 sentences, make it sting and make it funny.`;
  }
  return base+`\n\nMODE: ANALYST. Be a sharp, neutral fantasy analyst. Give clear, data-backed answers about standings, matchups, trends, and history. Be honest about what the numbers show. No hype, no trash talk.`;
}

async function callBot(userText){
  const ctx = await buildLeagueContext();
  const system = systemPromptFor(botMode, ctx);
  botHistory.push({role:'user', content:userText});

  // Convert our history to Gemini's "contents" format.
  // Gemini roles: 'user' and 'model' (not 'assistant'). System goes separate.
  const contents = botHistory.slice(-12).map(m=>({
    role: m.role==='assistant' ? 'model' : 'user',
    parts: [{text: m.content}]
  }));
  const payload = {
    contents,
    systemInstruction: { parts:[{text: system}] },
    generationConfig: {
      maxOutputTokens: 2048,
      temperature: botMode==='smack'?1.1:0.6
      // thinking config is added per-model below (2.5 and 3.x use different params)
    },
    // Allow rough trash talk to get through, but keep hate speech filtered.
    safetySettings: botMode==='smack' ? [
      { category:"HARM_CATEGORY_HARASSMENT", threshold:"BLOCK_ONLY_HIGH" },
      { category:"HARM_CATEGORY_DANGEROUS_CONTENT", threshold:"BLOCK_MEDIUM_AND_ABOVE" },
      { category:"HARM_CATEGORY_HATE_SPEECH", threshold:"BLOCK_MEDIUM_AND_ABOVE" },
      { category:"HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold:"BLOCK_MEDIUM_AND_ABOVE" }
    ] : undefined
  };

  // Build the thinking setting the way each model generation expects.
  // 3.x models use thinkingLevel; 2.5 models use thinkingBudget (0 = off).
  function payloadFor(model){
    const gc = Object.assign({}, payload.generationConfig);
    if(/gemini-3/.test(model)){
      gc.thinkingConfig = { thinkingLevel: "low" };
    } else {
      gc.thinkingConfig = { thinkingBudget: 0 }; // 2.5 family: thinking off
    }
    return Object.assign({}, payload, { generationConfig: gc });
  }

  // Transport: deployed Worker (key stays server-side), or local bring-your-own-key.
  // Both retry on 503 (Gemini overloaded), then fall back to the lighter model.
  const sleep = ms => new Promise(res=>setTimeout(res,ms));

  async function tryOnce(model){
    const mp = payloadFor(model);
    if(BOT_ENDPOINT){
      const r = await fetch(BOT_ENDPOINT, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({model, payload: mp})
      });
      return r;
    }
    const url = `${GEMINI_URL}/${model}:generateContent`;
    return fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':BYO_KEY},
      body: JSON.stringify(mp)
    });
  }

  if(!BOT_ENDPOINT && !BYO_KEY) throw new Error('NO_TRANSPORT');

  // Try primary model with retries, then the fallback model with retries.
  const models = [BOT_MODEL, BOT_FALLBACK_MODEL].filter(Boolean);
  let lastErr = '';
  for(let mi=0; mi<models.length; mi++){
    const model = models[mi];
    for(let attempt=0; attempt<3; attempt++){
      let r;
      try{ r = await tryOnce(model); }
      catch(e){ lastErr = String(e.message||e); break; } // network fail → try next model
      if(r.ok) return extractText(await r.json());
      const body = await r.text();
      lastErr = 'HTTP '+r.status+' '+body.slice(0,160);
      // 503/429/500 = overloaded or rate-limited → wait and retry, then fall back
      if(r.status===503 || r.status===429 || r.status===500){
        await sleep(800*(attempt+1)); // 0.8s, 1.6s, 2.4s
        continue;
      }
      break; // other errors won't fix themselves; stop retrying this model
    }
  }
  // Everything failed.
  if(/503|overloaded|high demand|UNAVAILABLE/i.test(lastErr))
    return "⚠️ Gemini is overloaded right now (that's on Google's end, not your setup). Give it a minute and try again.";
  return '⚠️ '+lastErr;
}
function extractText(data){
  if(data && data.error) return '⚠️ '+(data.error.message||'API error');
  const cand = data && data.candidates && data.candidates[0];
  if(!cand) return '(no response)';
  if(cand.finishReason==='SAFETY') return "I'll sit that one out — tone it down and ask again.";
  const parts = cand.content && cand.content.parts;
  const text = parts ? parts.map(p=>p.text||'').join('').trim() : '';
  if(!text){
    if(cand.finishReason==='MAX_TOKENS') return "That answer ran long and got cut off. Ask me something a little narrower.";
    return '(no text returned)';
  }
  // If it stopped at the ceiling but we got text, flag the cut so it isn't silent.
  if(cand.finishReason==='MAX_TOKENS') return text+' …\n\n(cut off — ask me to continue)';
  return text;
}

function renderBot(){
  const setupNeeded = !BOT_ENDPOINT && !BYO_KEY;
  let html='<div class="fade">';
  html+=`<div class="bot-modes">
    <button class="mode-btn analyst ${botMode==='analyst'?'on':''}" onclick="window.__botMode('analyst')"><span class="em">📊</span>Analyst</button>

  </div>`;

  if(setupNeeded){
    html+=`<div class="bot-setup">
      <b>One quick step to turn the bot on.</b><br>

      <b>Just want to test it now?</b> Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com</a> and paste it below. It stays in this browser tab only, is never saved, and is only meant for trying it on your own machine.
      <div class="keybox">

  }

  const suggests = botMode==='smack'
    ? ['Roast the last-place team','Who is overrated this year?','Trash talk the champ','Funniest collapse so far']
    : ['Who is most likely to win it all?','Which team has the best record all-time?','Who has been the unluckiest?','Break down the playoff race'];
  html+='<div class="suggests">'+suggests.map(s=>`<span class="chip" onclick="window.__ask(this.textContent)">${esc(s)}</span>`).join('')+'</div>';

  html+=`<div class="panel pad chat">
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input">
      <textarea id="chatBox" rows="1" placeholder="Ask about your league…" ${setupNeeded?'disabled':''}></textarea>
      <button class="send-btn" id="sendBtn" onclick="window.__send()" ${setupNeeded?'disabled':''}>Send</button>
    </div>
  </div></div>`;

  const box=document.getElementById('chatBox');

    box.addEventListener('input',()=>{box.style.height='auto';box.style.height=Math.min(box.scrollHeight,120)+'px';});
    box.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();window.__send();} });
  }
}
function paintLog(){
  const log=document.getElementById('chatLog'); if(!log)return;
  if(!botHistory.length){
    log.innerHTML=`<div class="msg bot ${botMode==='smack'?'smack':''}"><div class="ava">${botMode==='smack'?'🔥':'🤖'}</div>
      <div class="bub">${botMode==='smack'?"Oh good, you showed up. Pick a team and I'll tell you why they're losing.":"Ask me anything about your league — standings, matchups, history, who's hot, who's not."}</div></div>`;
    return;
  }
  log.innerHTML=botHistory.map(m=>{
    if(m.role==='user') return `<div class="msg user"><div class="ava">🧑</div><div class="bub">${esc(m.content)}</div></div>`;
    return `<div class="msg bot ${botMode==='smack'?'smack':''}"><div class="ava">${botMode==='smack'?'🔥':'🤖'}</div><div class="bub">${esc(m.content)}</div></div>`;
  }).join('');
  log.scrollTop=log.scrollHeight;
}
window.__botMode=m=>{ botMode=m; renderBot(); };
window.__setKey=()=>{ const v=document.getElementById('byoKey').value.trim(); if(v){BYO_KEY=v; renderBot();} };
window.__ask=t=>{ const b=document.getElementById('chatBox'); if(b){b.value=t; window.__send();} };
window.__send=async()=>{
  if(botBusy) return;
  const box=document.getElementById('chatBox'); const txt=box.value.trim(); if(!txt)return;
  box.value=''; box.style.height='auto';
  botBusy=true; document.getElementById('sendBtn').disabled=true;
  paintLog();
  const log=document.getElementById('chatLog');
  log.innerHTML+=`<div class="msg user"><div class="ava">🧑</div><div class="bub">${esc(txt)}</div></div>
    <div class="msg bot ${botMode==='smack'?'smack':''}" id="typing"><div class="ava">${botMode==='smack'?'🔥':'🤖'}</div><div class="bub"><span class="typing"><span></span><span></span><span></span></span></div></div>`;
  log.scrollTop=log.scrollHeight;
  try{
    const reply=await callBot(txt);
    botHistory.push({role:'assistant', content:reply});
  }catch(e){
    let m=String(e.message||e);
    if(m==='NO_TRANSPORT') m='Set up the bot first — paste a key or add your Worker URL.';
    botHistory.push({role:'assistant', content:'⚠️ '+m});
  }
  botBusy=false;
  const sb=document.getElementById('sendBtn'); if(sb)sb.disabled=false;
  paintLog();
};

  try{
    await loadCore();
    const cur=D.seasons[0];
    document.getElementById('leagueName').textContent=cur.league.name||'Your League';
    const range = D.seasons.length>1 ? `${D.seasons[D.seasons.length-1].league.season}–${cur.league.season}` : cur.league.season;
    document.getElementById('leagueSub').innerHTML=`<b>${cur.league.total_rosters||cur.rosters.length}-team</b> league · <b>${D.seasons.length}</b> season${D.seasons.length>1?'s':''} (${range}) · Week ${D.state.week||'—'} of ${D.state.season||cur.league.season}`;
    buildTabs();
    await selectTab('overview');
  }catch(e){
    const msg=String(e.message||e);
    const blocked=/failed to fetch|networkerror|load failed/i.test(msg);
    if(blocked){
      view.innerHTML=`<div class="err"><b>Can't reach Sleeper from here.</b><br>
      This usually means the page is running inside a preview window that blocks outside connections.<br><br>
      <b>To fix it:</b> download this file and open it directly in your browser
      (double-click the saved <code>.html</code> file). It will then load fine.<br><br>
      If it still fails after that, the file may need to run from a small local server.
      See the chat for the one-line command.<br><br>
      <span style="color:var(--dim)">Technical detail: ${esc(msg)}</span></div>`;
    } else {
      view.innerHTML=`<div class="err"><b>Could not load the league.</b><br>${esc(msg)}<br><br>
        Check that the league ID is correct.</div>`;
    }
  }
})();
</script>
</body>
</html>
